// Escrito para que lo entienda alguien que no sigue el basquetbol.
const GLOS={
 'ORtg':['Rendimiento ofensivo','Puntos que anota el equipo cada 100 veces que tiene la pelota. Sirve para comparar equipos que juegan a distinta velocidad: uno puede anotar más puntos por partido solo porque juega más rápido, no porque ataque mejor.'],
 'DRtg':['Rendimiento defensivo','Puntos que le anotan cada 100 veces que el rival tiene la pelota. Acá <b>menos es mejor</b>.'],
 'NET':['Diferencial','ORtg menos DRtg. Cuántos puntos por cada 100 posesiones le saca al rival. Es la medida más simple de cuán mejor es un equipo que sus rivales.'],
 'Ritmo':['Ritmo de juego','Posesiones por cada 40 minutos. Alto = partido rápido con muchos ataques; bajo = juego lento y controlado. No es bueno ni malo, es un estilo.'],
 'eFG%':['Tiro efectivo','Porcentaje de acierto <b>dando al triple el valor que tiene</b>.<br><br><code>eFG% = (TC convertidos + 0,5 × triples convertidos) ÷ TC intentados</code><br><br>Un 4/10 en triples (12 puntos) rinde más que un 5/10 en dobles (10 puntos), y el porcentaje común no lo muestra: eFG% sí.'],
 'TS%':['True Shooting','Como el eFG% pero sumando los tiros libres. Es la medida más completa de eficiencia de tiro: mide cuántos puntos saca de cada intento, venga de donde venga.'],
 'TOV%':['Pérdidas por posesión','<b>TOV</b> es <i>turnover</i>: pérdida. De cada 100 veces que el equipo tuvo la pelota, en cuántas la entregó sin llegar a tirar.<br><br><code>TOV% = pérdidas ÷ posesiones × 100</code><br><code>posesiones = TC intentados − rebotes ofensivos + pérdidas + 0,44 × TL intentados</code><br><br>Cada pérdida es un ataque regalado, así que <b>menos es mejor</b>.'],
 'TOV':['Pérdida (turnover)','Cuando el equipo entrega la pelota al rival sin haber llegado a tirar: un pase robado, salir de la cancha, doble drible, pasar los 24 segundos. En inglés <i>turnover</i>, de ahí la sigla.'],
 'OR%':['Rebote ofensivo','De los rebotes disponibles bajo su propio aro cuando falla, qué porcentaje agarra. Cada rebote ofensivo es una segunda oportunidad de anotar en la misma posesión.'],
 'FTr':['Frecuencia de libres','Tiros libres intentados por cada 100 tiros de campo. Alto significa un equipo que ataca el aro y provoca faltas, en vez de resolver de lejos.'],
 'PPS':['Puntos por tiro','Puntos que saca en promedio de cada lanzamiento de campo. Un triple con 33% de acierto rinde 1,00; un doble con 50%, también. Permite comparar tiros de distinto valor.'],

// ---------- lectura del grafico de eficiencia, en castellano llano ----------
// Se calcula sobre los equipos que se estan mostrando, asi que sirve igual
// para cualquier liga y se actualiza sola al sumar partidos.
function lecturaScatter(TE){
  if(!TE||TE.length<2) return '';
  const n1v=x=>n1(x);
  const ata=[...TE].sort((a,b)=>b.ortg-a.ortg);
  const def=[...TE].sort((a,b)=>a.drtg-b.drtg);
  const net=[...TE].sort((a,b)=>(b.ortg-b.drtg)-(a.ortg-a.drtg));
  const mAta=ata[0], mDef=def[0], mNet=net[0], peor=net[net.length-1];
  const medO=TE.reduce((s,t)=>s+t.ortg,0)/TE.length;
  const medD=TE.reduce((s,t)=>s+t.drtg,0)/TE.length;
  // el que mas se despega en una sola cosa
  const soloAta=[...TE].sort((a,b)=>((b.ortg-medO)-(b.drtg-medD)*-1*0)-(0))[0];
  const buenos=TE.filter(t=>t.ortg>medO&&t.drtg<medD);
  const flojos=TE.filter(t=>t.ortg<medO&&t.drtg>medD);
  // desequilibrados: bien en una punta, mal en la otra
  const desO=TE.filter(t=>t.ortg>medO&&t.drtg>medD).sort((a,b)=>(b.ortg-medO)-(a.ortg-medO))[0];
  const desD=TE.filter(t=>t.drtg<medD&&t.ortg<medO).sort((a,b)=>(medD-b.drtg)-(medD-a.drtg))[0];
  const P=[];
  P.push(`<b>Cómo se lee:</b> cada punto es un equipo. Cuanto más a la <b>derecha</b>, más
    puntos anota. Cuanto más <b>arriba</b>, menos puntos recibe: el eje vertical está dado
    vuelta justamente para que defender bien quede arriba. Así que el mejor lugar del gráfico
    es <b>arriba a la derecha</b> —anota mucho y recibe poco— y el peor es abajo a la izquierda. Todo está medido <b>por cada 100 veces que el equipo tiene la pelota</b>, no
    por partido, para que un equipo que juega rápido no parezca mejor solo por jugar más.`);
  const mismo = mAta.name===mDef.name;
  if(mismo){
    P.push(`<b>${sh(mAta.name)} es el mejor de los dos lados</b>: el que más anota
      (${n1v(mAta.ortg)}) y el que menos recibe (${n1v(mDef.drtg)}). Eso no es común: la
      mayoría de los equipos es bueno en una cosa y regular en la otra.`);
  } else {
    P.push(`<b>El mejor ataque es ${sh(mAta.name)}</b>, con ${n1v(mAta.ortg)} puntos cada 100
      posesiones: es el punto más a la derecha. <b>La mejor defensa es ${sh(mDef.name)}</b>,
      que recibe ${n1v(mDef.drtg)}: es el punto más alto. Para tener una referencia, el
      promedio de la liga anda por ${n1v(medO)} anotados.`);
  }
  const dn=mNet.ortg-mNet.drtg;
  if(mNet.name!==mAta.name||mNet.name!==mDef.name){
    P.push(`Pero el que <b>mejor combina las dos cosas es ${sh(mNet.name)}</b>: le saca
      ${n1v(dn)} puntos cada 100 posesiones a sus rivales (anota ${n1v(mNet.ortg)} y recibe
      ${n1v(mNet.drtg)}). Esa diferencia es la que mejor anticipa quién gana partidos, mejor
      que mirar solo el ataque o solo la defensa.`);
  }
  if(buenos.length){
    P.push(`<b>Mejores que el promedio en ataque y en defensa a la vez:</b>
      ${buenos.sort((a,b)=>(b.ortg-b.drtg)-(a.ortg-a.drtg)).map(t=>sh(t.name)).join(', ')}.
      ${buenos.length===1?'Es el único que lo logra.':'Son '+buenos.length+' de '+TE.length+'.'}`);
  }
  if(desO&&desD){
    P.push(`Dos casos opuestos que se ven bien en el gráfico: <b>${sh(desO.name)}</b> anota
      por encima del promedio (${n1v(desO.ortg)} contra ${n1v(medO)}) pero también recibe
      más que el promedio (${n1v(desO.drtg)} contra ${n1v(medD)}) — juega partidos abiertos.
      Y <b>${sh(desD.name)}</b> es al revés: recibe menos que el promedio
      (${n1v(desD.drtg)}) pero también anota menos (${n1v(desD.ortg)}) — sus partidos
      terminan con marcadores más bajos.`);
  } else if(desO){
    P.push(`<b>${sh(desO.name)}</b> anota por encima del promedio (${n1v(desO.ortg)}) pero
      también recibe más que el promedio (${n1v(desO.drtg)}): juega partidos abiertos.`);
  } else if(desD){
    P.push(`<b>${sh(desD.name)}</b> recibe menos que el promedio (${n1v(desD.drtg)}) pero
      también anota menos (${n1v(desD.ortg)}): sus partidos terminan con marcadores bajos.`);
  }
  if(peor&&peor.name!==mNet.name){
    P.push(`En la otra punta, <b>${sh(peor.name)}</b> es el que peor la pasa:
      ${n1v(peor.drtg-peor.ortg)} puntos de desventaja cada 100 posesiones.`);
  }
  const pjMin=Math.min(...TE.map(t=>t.g));
  P.push(`<span style="color:var(--tx3)">Un aviso: esto describe lo que pasó, no predice
    lo que va a pasar.${pjMin<10?' Y con '+pjMin+' partidos jugados por el equipo con menos '
    +'actividad, un par de resultados mueven mucho estos números.':''}</span>`);
  return P.map(t=>'<p style="margin:0 0 10px">'+t+'</p>').join('');
}

/* Escala de color por PPS (puntos por tiro). Rojo = ineficiente, verde = eficiente. */
function ppsColor(v){
  if(v==null) return '#1c2230';
  const lo=0.60, hi=1.25, t=Math.max(0,Math.min(1,(v-lo)/(hi-lo)));
  // rojo -> ambar -> verde
  const c1=[248,81,73], c2=[210,153,34], c3=[63,185,80];
  let a,b,u;
  if(t<0.5){a=c1;b=c2;u=t/0.5} else {a=c2;b=c3;u=(t-0.5)/0.5}
  const m=a.map((x,i)=>Math.round(x+(b[i]-x)*u));
  return 'rgb('+m.join(',')+')';
}

/* Carta de tiro con coordenadas reales del feed (data.tm[k].shot).
   dx = distancia al aro sobre el eje largo, dy = desplazamiento lateral, en metros. */
function shotCourt(dots,opts){
  opts=opts||{};
  const U=21, CX=160, BY=300;            // 21 px por metro
  const px=dy=>CX+dy*U, py=dx=>BY-(dx+2)*U;
  const HY=py(0), BLY=py(-1.575), R3=6.75*U;
  const paintTop=py(4.225), paintL=px(-2.45), paintR=px(2.45);
  const cornerX=6.6, yArc=Math.sqrt(Math.max(0,6.75*6.75-cornerX*cornerX));
  const arc=`M ${px(-cornerX)} ${BLY} L ${px(-cornerX)} ${py(yArc)} A ${R3} ${R3} 0 0 1 ${px(cornerX)} ${py(yArc)} L ${px(cornerX)} ${BLY}`;
  const made=dots.filter(d=>d[2]), miss=dots.filter(d=>!d[2]);
  const dot=(d,cls)=>`<circle cx="${px(d[1]).toFixed(1)}" cy="${py(d[0]).toFixed(1)}" r="${opts.r||3.1}" class="${cls}"/>`;
  return `<svg class="scourt" viewBox="0 0 320 310" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="320" height="310" fill="#10151c"/>
    <g fill="none" stroke="#39445a" stroke-width="1.5">
      <path d="M ${px(-7.5)} ${BLY} L ${px(7.5)} ${BLY}"/>
      <path d="M ${px(-7.5)} ${BLY} L ${px(-7.5)} 6 L ${px(7.5)} 6 L ${px(7.5)} ${BLY}"/>
      <path d="${arc}"/>
      <rect x="${paintL}" y="${paintTop}" width="${paintR-paintL}" height="${BLY-paintTop}"/>
      <path d="M ${px(-1.8)} ${paintTop} A ${1.8*U} ${1.8*U} 0 0 0 ${px(1.8)} ${paintTop}"/>
      <circle cx="${CX}" cy="${HY}" r="${0.225*U}"/>
      <path d="M ${px(-0.9)} ${py(-0.9)} L ${px(0.9)} ${py(-0.9)}" stroke-width="2.5"/>
    </g>
    <g fill="none" stroke="#2a3241" stroke-dasharray="3 4">
      <circle cx="${CX}" cy="${HY}" r="${1.25*U}"/><circle cx="${CX}" cy="${HY}" r="${3*U}"/><circle cx="${CX}" cy="${HY}" r="${5*U}"/>
    </g>
    <g class="miss" fill="none" stroke="#f85149" stroke-width="1.5" opacity=".85">
      ${miss.map(d=>`<path d="M ${(px(d[1])-2.6).toFixed(1)} ${(py(d[0])-2.6).toFixed(1)} l 5.2 5.2 M ${(px(d[1])+2.6).toFixed(1)} ${(py(d[0])-2.6).toFixed(1)} l -5.2 5.2"/>`).join('')}
    </g>
    <g class="made" fill="#3fb950" opacity=".9">${made.map(d=>dot(d,'')).join('')}</g>
  </svg>
  <div class="dotleg"><span><i style="background:#3fb950"></i>Convertido (${made.length})</span>
    <span><i style="background:none;border:1.5px solid #f85149;border-radius:0;transform:rotate(45deg)"></i>Fallado (${miss.length})</span>
    <span class="dim">Arcos punteados: 1,25 m · 3 m · 5 m</span></div>`;
}
/* Mapa de calor por celdas de 1 m */
function heatCourt(cells,opts){
  opts=opts||{};
  const U=21, CX=160, BY=300;
  const px=dy=>CX+dy*U, py=dx=>BY-(dx+2)*U;
  const BLY=py(-1.575), R3=6.75*U, paintTop=py(4.225);
  const cornerX=6.6, yArc=Math.sqrt(Math.max(0,6.75*6.75-cornerX*cornerX));
  const mx=Math.max(...cells.map(c=>c[2]),1);
  return `<svg class="scourt" viewBox="0 0 320 310" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="320" height="310" fill="#10151c"/>
    <g>${cells.map(c=>{
      const x=px(c[0]), y=py(c[1]+1), w=U, h=U;
      const op=0.20+0.80*Math.min(1,c[2]/mx);
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w}" height="${h}" fill="${ppsColor(c[4])}" opacity="${op.toFixed(2)}"/>`}).join('')}</g>
    <g fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.4">
      <path d="M ${px(-7.5)} ${BLY} L ${px(7.5)} ${BLY}"/>
      <path d="M ${px(-6.6)} ${BLY} L ${px(-6.6)} ${py(yArc)} A ${R3} ${R3} 0 0 1 ${px(6.6)} ${py(yArc)} L ${px(6.6)} ${BLY}"/>
      <rect x="${px(-2.45)}" y="${paintTop}" width="${4.9*U}" height="${BLY-paintTop}"/>
      <path d="M ${px(-0.9)} ${py(-0.9)} L ${px(0.9)} ${py(-0.9)}" stroke-width="2.5"/>
    </g></svg>
  <div class="dotleg"><span class="dim">Intensidad = volumen de tiros · Color = PPS de la celda (rojo bajo, verde alto). Celdas con 3 tiros o más.</span></div>`;
}

  function seasonDots(team){

        const roster=g.bx.filter(r=>r[22]===+k);

          out.push([d[0],d[1],d[2],d[3],pl?pl[1]:'—',d[5],g[side].name]);
        }

    }
    return out;
  }
  function applyF(arr,filt,q,pl){
    let o=arr;
    if(filt==='2') o=o.filter(d=>!d[3]);

    if(q==='9') o=o.filter(d=>d[5]>=5);
    else if(q!=='0') o=o.filter(d=>d[5]===+q);
    if(pl) o=o.filter(d=>d[4]===pl);
    return o;
  }

    const z=Array.from({length:9},()=>({m:0,a:0,p:0}));

      z[i].a++; if(d[2]){z[i].m++; z[i].p+=d[3]?3:2}
    }
    const A=arr.length||1, P=z.reduce((s,x)=>s+x.p,0), M=z.reduce((s,x)=>s+x.m,0);
    return {z:z.map(x=>({m:x.m,a:x.a,pps:x.a?x.p/x.a:null,fg:x.a?x.m/x.a*100:null,share:x.a/A*100})),
            att:arr.length,made:M,pps:P/A};
  }

      '<thead><tr><th class="l">Lanzamiento</th><th>C/I</th><th>%</th><th style="width:80px">Vol.</th></tr></thead><tbody>'+
      items.map(e=>`<tr><td class="l"><span class="dim" style="font-size:10px">${e.ty.toUpperCase()}</span> ${e.sub}</td>
        <td>${e.m}/${e.a}</td>

  const byEfg=TE.slice().sort((a,b)=>b.efg-a.efg);

    data:{labels:byEfg.map(t=>sh(t.name)),datasets:[
      {label:'eFG%',data:byEfg.map(t=>t.efg),backgroundColor:byEfg.map(t=>t.color),borderRadius:4},
      {label:'OR%',data:byEfg.map(t=>t.orp),backgroundColor:'rgba(255,255,255,.18)',borderRadius:4}]},

      scales:{x:{grid:{color:'#232a36'}},y:{grid:{display:false},ticks:{font:{size:10}}}}}}));

  const byTov=TE.slice().sort((a,b)=>a.tov-b.tov);
  charts.push(new Chart(document.getElementById('cTov'),{type:'bar',
    data:{labels:byTov.map(t=>sh(t.name)),datasets:[
      {label:'TOV% (menos es mejor)',data:byTov.map(t=>t.tov),backgroundColor:byTov.map(t=>t.color),borderRadius:4},
      {label:'FTr',data:byTov.map(t=>t.ftr),backgroundColor:'rgba(255,255,255,.18)',borderRadius:4}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'top',labels:{boxWidth:10,boxHeight:10,usePointStyle:true,pointStyle:'circle'}},
        title:{display:true,text:'Pérdidas y tiros libres por tiro de campo',color:'#8b949e'}},
      scales:{x:{grid:{color:'#232a36'}},y:{grid:{display:false},ticks:{font:{size:10}}}}}}));
}

/* ---------- LISTA DE PARTIDOS ---------- */
let fTeam='',fQ='',fSort='fecha',fFase='';
function renderPart(){
  const teams=[...new Set(G.flatMap(g=>[g.A.name,g.B.name]))].sort();
  let rows=G.slice();
  if(fTeam) rows=rows.filter(g=>g.A.name===fTeam||g.B.name===fTeam);
  if(fFase) rows=rows.filter(g=>g.fase===fFase);
  if(fQ){const q=fQ.toLowerCase();rows=rows.filter(g=>(g.A.name+' '+g.B.name+' '+g.id+' '+g.venue+' '+g.date+' '+(g.fase||'')).toLowerCase().includes(q))}
  if(fSort==='fecha') rows.sort((a,b)=>dsort(b.date)-dsort(a.date));
  if(fSort==='dif') rows.sort((a,b)=>b.margin-a.margin);
  if(fSort==='ajust') rows.sort((a,b)=>a.margin-b.margin);
  if(fSort==='pts') rows.sort((a,b)=>(b.A.pts+b.B.pts)-(a.A.pts+a.B.pts));
  document.getElementById('v-part').innerHTML=`
    <div class="hero" style="padding:20px 24px">
      <div class="meta"><span>Liga Uruguaya de Basquetbol 2026/2027</span><span>${G.length} partidos</span><span>Clic en cualquier partido para el análisis completo</span></div>
      <div class="filters">
        <select id="fT"><option value="">Todos los equipos</option>${teams.map(t=>`<option value="${t}" ${t===fTeam?'selected':''}>${t}</option>`).join('')}</select>
        <select id="fF"><option value="">Todas las fases</option>${FASES.map(f=>`<option value="${f}" ${f===fFase?'selected':''}>${f}</option>`).join('')}</select>
        <select id="fS">
          <option value="fecha" ${fSort==='fecha'?'selected':''}>Más recientes primero</option>
          <option value="dif" ${fSort==='dif'?'selected':''}>Mayor diferencia</option>
          <option value="ajust" ${fSort==='ajust'?'selected':''}>Más ajustados</option>
          <option value="pts" ${fSort==='pts'?'selected':''}>Más anotadores</option>
        </select>
        <input type="text" id="fQ" placeholder="Buscar equipo, sede, ID…" value="${fQ}" style="min-width:200px">
        <span class="dim" style="font-size:12px">${rows.length} resultado${rows.length===1?'':'s'}</span>
      </div>
    </div>
    <div class="sec"><div class="glist">${rows.map(g=>{
      const aw=g.win==='A';
      return `<div class="grow" data-id="${g.id}">
        <div class="d">${g.date||'s/f'}<div style="font-size:10px;color:var(--tx2);letter-spacing:.03em;text-transform:uppercase;margin-top:2px">${g.fase||''}</div></div>
        <div class="ta" style="color:${aw?g.A.color:'var(--tx2)'}">${sh(g.A.name)}</div>
        <div class="sc">${g.A.pts} <span class="dim" style="font-weight:400">–</span> ${g.B.pts}</div>
        <div class="tb" style="color:${!aw?g.B.color:'var(--tx2)'}">${sh(g.B.name)}</div>
        <div class="tag">${g.ot?'<span class="otb">'+(g.ot>1?g.ot+'PE':'PE')+'</span>':(g.hand?'<span class="hb">★</span>':'<span class="dim">+'+g.margin+'</span>')}</div>
      </div>`}).join('')}</div></div>`;
  document.getElementById('fT').onchange=e=>{fTeam=e.target.value;renderPart()};
  document.getElementById('fF').onchange=e=>{fFase=e.target.value;renderPart()};
  document.getElementById('fS').onchange=e=>{fSort=e.target.value;renderPart()};
  const qi=document.getElementById('fQ');
  qi.oninput=e=>{fQ=e.target.value;const p=e.target.selectionStart;renderPart();const n=document.getElementById('fQ');n.focus();n.setSelectionRange(p,p)};
  document.querySelectorAll('.grow').forEach(r=>r.onclick=()=>openGame(r.dataset.id));
}

    ['True Shooting %',`${n1(A.ts)} / ${n1(B.ts)}`,'incluye triples y libres'],

    </div>
    <div class="card scroll" style="margin-top:14px"><table class="zt">
      <thead><tr><th class="l">Zona medida</th><th style="color:${A.color}">${sh(A.name)}</th><th>PPS</th><th style="color:${B.color}">${sh(B.name)}</th><th>PPS</th><th class="dim">Liga PPS</th></tr></thead>
      <tbody>${(g.gz2&&g.gz2['1']&&g.gz2['2'])?P.zn2.map((zn,i)=>{
        const a=g.gz2['1'].z[i], b=g.gz2['2'].z[i], L=P.lgz2.z[i];
        return `<tr><td class="l zl"><b style="color:${ppsColor(L.pps)}">${zn}</b></td>
        <td>${a.m}/${a.a}</td><td style="color:${ppsColor(a.a>=3?a.pps:null)}">${a.a>=3?n1(a.pps*100)/100:'–'}</td>
        <td>${b.m}/${b.a}</td><td style="color:${ppsColor(b.a>=3?b.pps:null)}">${b.a>=3?n1(b.pps*100)/100:'–'}</td>
        <td class="dim">${n1(L.pps*100)/100}</td></tr>`}).join(''):''}
      ${(g.gz2&&g.gz2['1']&&g.gz2['2'])?`<tr class="tot"><td class="l">TOTAL</td>
        <td>${g.gz2['1'].made}/${g.gz2['1'].att}</td><td>${n1(g.gz2['1'].pps*100)/100}</td>
        <td>${g.gz2['2'].made}/${g.gz2['2'].att}</td><td>${n1(g.gz2['2'].pps*100)/100}</td>
        <td class="dim">${n1(P.lgz2.pps*100)/100}</td></tr>`:''}</tbody></table></div>
    <div class="hint">Coordenadas reales del feed. Verde = convertido, cruz roja = fallado. Arcos punteados de referencia a 1,25 m, 3 m y 5 m del aro. Los selectores filtran por período y por jugador de cada equipo; el número entre paréntesis es la cantidad de tiros de cada uno.</div>
  </div>
  <div class="sec"><h2>Zonas por subtipo de lanzamiento</h2>
    <div class="grid2">
      <div class="card"><h3 style="font-size:14px;color:${A.color};margin-bottom:10px">${A.name}</h3>
        ${g.gz['1']?courtSVG(g.gz['1'].z,{uid:'ga'})+zoneLegend(g.gz['1'].z):'<div class="dim">sin datos</div>'}</div>
      <div class="card"><h3 style="font-size:14px;color:${B.color};margin-bottom:10px">${B.name}</h3>
        ${g.gz['2']?courtSVG(g.gz['2'].z,{uid:'gb'})+zoneLegend(g.gz['2'].z):'<div class="dim">sin datos</div>'}</div>
    </div>
    <div class="card scroll" style="margin-top:14px"><table>
      <thead><tr><th class="l">Métrica</th><th style="color:${A.color}">${sh(A.name)}</th><th style="color:${B.color}">${sh(B.name)}</th><th class="dim">Liga</th></tr></thead>
      <tbody>${g.gz['1']&&g.gz['2']?[
        ['PPS (puntos por intento)','pps',2],['PPS esperado por selección','xpps',2],
        ['Ventaja por selección (x100 tiros)','sel',1],['Ventaja por acierto (x100 tiros)','make',1],
        ['% de tiros en el aro','rim',1],['% en media distancia','mid',1],['% de triples','three',1],
        ['Índice moderno (aro+triple)','modern',1],['% de creación propia','crea',1]
      ].map(([lab,k,dec])=>{const a=g.gz['1'][k],b=g.gz['2'][k];
        const lg=k==='pps'||k==='xpps'?n1(P.lgz.pps*100)/100:(k==='sel'||k==='make'?'0,0':'–');
        const f=v=>dec===2?n1(v*100)/100:n1(v);
        return `<tr><td class="l" style="font-size:12px;color:var(--tx3)">${lab}</td>
        <td style="${a>b?'font-weight:700;color:'+A.color:'color:var(--tx2)'}">${f(a)}</td>
        <td style="${b>a?'font-weight:700;color:'+B.color:'color:var(--tx2)'}">${f(b)}</td>
        <td class="dim">${lg}</td></tr>`}).join(''):''}</tbody></table></div>
    <div class="hint">Zonas derivadas del subtipo de lanzamiento — el feed no publica coordenadas de cancha. El número grande es convertidos/intentados y el chico el PPS de la zona.</div>
  </div>
  <div class="sec"><h2>Perfil de tiro por tipo de lanzamiento</h2>
    <div class="grid2">
      <div class="card"><h3 style="font-size:14px;color:${A.color};margin-bottom:12px">${A.name}</h3><table id="sha"></table></div>
      <div class="card"><h3 style="font-size:14px;color:${B.color};margin-bottom:12px">${B.name}</h3><table id="shb"></table></div>
    </div>
    <div class="hint">El feed no incluye coordenadas de cancha, así que la carta de tiro se reconstruye por subtipo de lanzamiento desde el play-by-play.</div></div>
  <div class="sec"><h2>Lectura del partido</h2>${g.lec.map((c,k)=>
    `<div class="note" style="border-left-color:${k%2?B.color:A.color}"><h3>${k+1}. ${c[0]}</h3><p>${c[1]}</p></div>`).join('')}</div>
  <div class="sec"><h2>Ficha</h2><div class="card" style="font-size:13px;color:var(--tx2);line-height:1.9">
    ${g.refs.length?`<b style="color:var(--tx)">Árbitros:</b> ${g.refs.join(' · ')}<br>`:''}
    <b style="color:var(--tx)">Máximos anotadores:</b> ${sh(A.name)} — ${g.top[0]||'s/d'} · ${sh(B.name)} — ${g.top[1]||'s/d'}<br>
    <b style="color:var(--tx)">Fuente:</b> FIBA LiveStats / Genius Sports — FUBB, match ${g.id}
  </div></div>`;
  document.getElementById('bk').onclick=()=>show('part');
  // ---- carta de tiro del partido con filtros ----
  let gQ='0',gPa='',gPb='';
  function gRoster(k){return g.bx.filter(r=>r[22]===k)}
  function gDots(k,pl){
    const ros=gRoster(k);
    let o=g.dots[String(k)].map(d=>[d[0],d[1],d[2],d[3],(ros[d[4]]||[])[1]||'—',d[5]]);
    if(gQ==='9') o=o.filter(d=>d[5]>=5); else if(gQ!=='0') o=o.filter(d=>d[5]===+gQ);
    if(pl) o=o.filter(d=>d[4]===pl);
    return o;
  }
  function gFill(){
    for(const [k,id,cur] of [[1,'gPa',gPa],[2,'gPb',gPb]]){
      const ros=gRoster(k);
      const cnt={}; g.dots[String(k)].forEach(d=>{const n=(ros[d[4]]||[])[1]||'—';cnt[n]=(cnt[n]||0)+1});
      const names=Object.keys(cnt).filter(n=>n!=='—').sort((a,b)=>cnt[b]-cnt[a]);
      document.getElementById(id).innerHTML=
        `<option value="">Todos — ${k===1?sh(A.name):sh(B.name)}</option>`+
        names.map(n=>`<option value="${n}" ${n===cur?'selected':''}>${n} (${cnt[n]})</option>`).join('');
    }
  }
  function gRender(){
    const da=gDots(1,gPa), db=gDots(2,gPb);
    document.getElementById('gCa').innerHTML=shotCourt(da,{r:3.4,uid:'ga'});
    document.getElementById('gCb').innerHTML=shotCourt(db,{r:3.4,uid:'gb'});
    const t=[gQ==='0'?null:(gQ==='9'?'suplementarios':gQ+'º cuarto')].filter(Boolean).join(' ');
    document.getElementById('gN').textContent=(da.length+db.length)+' tiros'+(t?' — '+t:'');
  }
  gFill(); gRender();
  document.getElementById('gQ').onchange=e=>{gQ=e.target.value;gRender()};
  document.getElementById('gPa').onchange=e=>{gPa=e.target.value;gRender()};
  document.getElementById('gPb').onchange=e=>{gPb=e.target.value;gRender()};
  document.getElementById('gRst').onclick=()=>{gQ='0';gPa='';gPb='';document.getElementById('gQ').value='0';gFill();gRender()};

  // ---- boxscore ----
  const BC=[['#',0,'l'],['Jugador',1,'l'],['Min',3],['Pts',4],['TC',5],['2P',6],['3P',7],['TL',8],
    ['RO',9],['RD',10],['REB',11],['AS',12],['PER',13],['REC',14],['TAP',15],['FP',16],['FR',17],
    ['Pint.',21],['+/-',18],['TS%',20],['VAL',19]];
  let bside=1,bsc=null,bsd=-1;
  function bval(r,i){const k=BC[i][1];
    if(k===3){const p=String(r[3]).split(':');return +p[0]*60+(+p[1]||0)}
    if([5,6,7,8].includes(k))return parseInt(r[k])||0;
    return r[k]==null?-1:r[k]}
  function rbx(){
    const T=bside===1?A:B, rows=g.bx.filter(r=>r[22]===bside).slice();
    if(bsc!==null) rows.sort((x,y)=>(bval(y,bsc)-bval(x,bsc))*(bsd<0?1:-1));
    const body=rows.map(r=>{
      const fg=r[5].split('/'), fgp=+fg[1]?(+fg[0]/+fg[1]*100):null;
      return `<tr>
        <td class="l dim">${r[0]}</td>
        <td class="l" style="font-weight:600">${r[2]?'<span class="st"></span>':''}${r[1]}</td>
        <td class="dim">${r[3]}</td>
        <td style="font-weight:700;${r[4]>=15?'color:'+T.color:''}">${r[4]}</td>
        <td>${r[5]}</td><td>${r[6]}</td><td>${r[7]}</td><td>${r[8]}</td>
        <td>${r[9]}</td><td>${r[10]}</td><td style="font-weight:600">${r[11]}</td>
        <td>${r[12]}</td><td>${r[13]}</td><td>${r[14]}</td><td>${r[15]}</td>
        <td class="${r[16]>=4?'neg':''}">${r[16]}</td><td>${r[17]}</td><td>${r[21]}</td>
        <td class="${r[18]>0?'pos':r[18]<0?'neg':''}" style="font-weight:600">${r[18]>0?'+':''}${r[18]}</td>
        <td class="${r[20]>=58?'pos':(r[20]!=null&&r[20]<40?'neg':'')}">${r[20]==null?'–':n1(r[20])}</td>
        <td style="font-weight:700" class="${r[19]>=15?'pos':r[19]<0?'neg':''}">${r[19]}</td></tr>`}).join('');
    const tv=g.bx.filter(r=>r[22]===bside).reduce((s,r)=>s+r[19],0);
    const tot=`<tr class="tot"><td class="l"></td><td class="l">TOTALES</td><td>${g.mins*5}:00</td><td>${T.pts}</td>
      <td>${T.fg[0]}/${T.fg[1]}</td><td>${T.p2[0]}/${T.p2[1]}</td><td>${T.p3[0]}/${T.p3[1]}</td><td>${T.ft[0]}/${T.ft[1]}</td>
      <td>${T.orr}</td><td>${T.dr}</td><td>${T.reb}</td><td>${T.ast}</td><td>${T.to}</td><td>${T.stl}</td>
      <td>${T.blk}</td><td>${T.pf}</td><td>${T.fd}</td><td>${T.paint}</td><td>–</td><td>${n1(T.ts)}</td><td>${tv}</td></tr>`;
    document.getElementById('tbx').innerHTML='<thead><tr>'+BC.map((c,i)=>
      `<th class="${c[2]==='l'?'l':''}" data-i="${i}" style="${i===bsc?'color:'+T.color:''}">${c[0]}${ig(c[0])}${i===bsc?(bsd<0?' ▾':' ▴'):''}</th>`).join('')+
      '</tr></thead><tbody>'+body+tot+'</tbody>';
    document.querySelectorAll('#tbx th').forEach(th=>th.onclick=()=>{const i=+th.dataset.i;if(bsc===i)bsd*=-1;else{bsc=i;bsd=-1}rbx()});
  }
  rbx();
  document.querySelectorAll('#bt .tab').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#bt .tab').forEach(x=>{x.classList.remove('on');x.style.background='';x.style.borderColor=''});
    b.classList.add('on'); const c=b.dataset.s==='1'?A.color:B.color; b.style.background=c; b.style.borderColor=c;
    bside=+b.dataset.s; bsc=null; rbx()});
  // ---- perfil de tiro ----
  function shTable(list){
    if(!list.length) return '<tbody><tr><td class="l dim">Sin detalle de subtipos en este partido</td></tr></tbody>';
    const maxA=Math.max(...list.map(e=>e[3]),1);
    return '<thead><tr><th class="l">Lanzamiento</th><th>C/I</th><th>%</th><th style="width:80px">Vol.</th></tr></thead><tbody>'+
      list.map(e=>{const p=e[3]?e[2]/e[3]*100:0;
        return `<tr><td class="l"><span class="dim" style="font-size:10px">${e[0].toUpperCase()}</span> ${e[1]}</td>
        <td>${e[2]}/${e[3]}</td><td class="${p>=50?'pos':(p<30?'neg':'')}">${e[3]?n0(p)+'%':'–'}</td>
        <td><div class="bar" style="height:7px"><i style="width:${(e[3]/maxA*100).toFixed(0)}%;background:${p>=50?'var(--good)':p>=33?'var(--warn)':'var(--bad)'}"></i></div></td></tr>`}).join('')+'</tbody>';
  }
  document.getElementById('sha').innerHTML=shTable(g.sh['1']);
  document.getElementById('shb').innerHTML=shTable(g.sh['2']);
  const M=g.mins, TL=g.tl;
  const pts=(k)=>TL.map(e=>({x:e[0]/60,y:e[k]}));
  const qlines=[]; for(let q=10;q<M;q+=(q<40?10:5)) qlines.push(q);
  const vlines={id:'vl',beforeDatasetsDraw(ch){const{ctx,chartArea,scales}=ch;ctx.save();
    qlines.forEach(q=>{const x=scales.x.getPixelForValue(q);ctx.strokeStyle=q===40?'#4a3a20':'#2f3948';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(x,chartArea.top);ctx.lineTo(x,chartArea.bottom);ctx.stroke()});ctx.restore()}};
  const per=(t)=>{ if(t<=40){const p=Math.min(Math.floor(t/10)+1,4),r=10-(t%10);
      return 'C'+p+' · '+Math.floor(r)+':'+String(Math.round((r%1)*60)).padStart(2,'0')+' restantes'}
    const o=Math.floor((t-40)/5)+1,r=5-((t-40)%5);
    return 'PE'+Math.min(o,g.ot)+' · '+Math.floor(r)+':'+String(Math.round((r%1)*60)).padStart(2,'0')+' restantes'};
  charts.push(new Chart(document.getElementById('cQ'),{type:'line',
    data:{datasets:[
      {label:A.name,data:pts(1),borderColor:A.color,borderWidth:2.2,pointRadius:0,stepped:true,tension:0},
      {label:B.name,data:pts(2),borderColor:B.color,borderWidth:2.2,pointRadius:0,stepped:true,tension:0}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'top',labels:{boxWidth:10,boxHeight:10,usePointStyle:true,pointStyle:'circle'}},
        tooltip:{callbacks:{title:i=>per(i[0].parsed.x)}}},
      scales:{x:{type:'linear',min:0,max:M,title:{display:true,text:'Minuto de juego',color:'#6e7681'},
          grid:{display:false},ticks:{stepSize:5,callback:v=>v>40?'PE'+Math.ceil((v-40)/5):v}},
        y:{beginAtZero:true,grid:{color:'#232a36'},title:{display:true,text:'Puntos',color:'#6e7681'}}}},
    plugins:[vlines]}));
  const diff=TL.map(e=>({x:e[0]/60,y:e[1]-e[2]}));
  charts.push(new Chart(document.getElementById('cD'),{type:'line',
    data:{datasets:[{label:'Diferencia',data:diff,borderColor:'#7c8cf8',borderWidth:2,pointRadius:0,stepped:true,
      fill:{target:{value:0},above:A.color+'44',below:B.color+'44'}}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{callbacks:{title:i=>per(i[0].parsed.x),
        label:i=>{const d=i.parsed.y;return d===0?'Empate':(d>0?sh(A.name):sh(B.name))+' +'+Math.abs(d)}}}},
      scales:{x:{type:'linear',min:0,max:M,grid:{display:false},ticks:{stepSize:5,callback:v=>v>40?'PE'+Math.ceil((v-40)/5):v}},
        y:{grid:{color:c=>c.tick.value===0?'#5a6478':'#232a36'},title:{display:true,text:'Dif.',color:'#6e7681'}}}},
    plugins:[vlines]}));
  charts.push(new Chart(document.getElementById('cS'),{type:'bar',
    data:{labels:['Pintura','Triples','Tiros libres','Contraataque','2ª oportunidad','De pérdidas rival','Banca'],
      datasets:[{label:A.name,data:[A.paint,A.p3[0]*3,A.ft[0],A.fb,A.so,A.pto,A.bench],backgroundColor:A.color,borderRadius:4},
        {label:B.name,data:[B.paint,B.p3[0]*3,B.ft[0],B.fb,B.so,B.pto,B.bench],backgroundColor:B.color,borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'top',labels:{boxWidth:10,boxHeight:10,usePointStyle:true,pointStyle:'circle'}}},
      scales:{x:{grid:{display:false}},y:{beginAtZero:true,grid:{color:'#232a36'},title:{display:true,text:'Puntos',color:'#6e7681'}}}}}));
  show('game');
}

function show(v){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  document.getElementById('v-'+v).classList.add('on');
  document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  window.scrollTo({top:0,behavior:'instant'});
}
document.querySelectorAll('.nb').forEach(b=>b.onclick=()=>{if(b.dataset.v!=='game'){killCharts();if(b.dataset.v==='temp')renderTemp();else renderPart();}show(b.dataset.v)});
document.getElementById('ngames').textContent='('+G.length+')';
renderTemp(); renderPart();
</script></body></html>
